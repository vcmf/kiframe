# Create a local board, name it, pick the note tool. The note tool step forces a 2.5× zoom:
# the Phase 0 zoom-quality check (finding F1, frames at CSS resolution).
version: 1
setup:
  - { action: goto, url: / }
steps:
  - id: new-board
    action: click
    target: { by: text, text: New Board, exact: true }
    caption: "Create a board: no account needed"
  - id: rename
    action: click
    # The collapsed sidebar has the same name first.
    target: { by: text, text: Untitled board, exact: true, nth: 1 }
  - id: name
    action: type
    target: { by: placeholder, text: Board name }
    value: Q4 roadmap
    clear: true
    submit: true
    caption: "Give it a name"
  - id: note-tool
    action: click
    target: { by: role, role: button, name: Note }
    camera: { frame: target, scale: 2.5 }
    caption: "Add sticky notes from the toolbar"
  - { id: look, action: pause, ms: 1200 }
