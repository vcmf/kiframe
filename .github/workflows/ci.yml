name: CI

# Pushes to main and to epic branches, and PRs into them (epic/** covers nested names too).
on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Recording tests encode takes with ffmpeg; the browser tests drive Chromium.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm --filter @kiframe/runtime exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Ubuntu 24 restricts the user namespaces Chromium's sandbox needs: allowed back (Electron runs
      # sandboxed as shipped). The tests run under a virtual display: the Electron target's tests
      # launch a fixture desktop app.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm test:coverage
        env:
          # Slow shutdown phases of a desktop app's launch, said (the Electron target's evidence).
          KIFRAME_ELECTRON_TIMING: "1"
      # The desktop app, built and launched under a virtual display.
      - name: Desktop end-to-end
        run: xvfb-run -a pnpm --filter @kiframe/desktop e2e
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
